<style>
  /* Toolbar Container - Hidden by default, shown via JS */
  #custom-chalk-toolbar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: none; /* Controlled by JS below */
    gap: 20px;
    background: rgba(30, 30, 30, 0.9);
    padding: 10px 20px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    opacity: 0.2; /* Faded when not interacting */
    transition: opacity 0.3s ease;
    align-items: center;
  }
  
  #custom-chalk-toolbar:hover {
    opacity: 1; /* Fully visible on hover */
  }

  /* Container for the color dots */
  .color-palette {
    display: flex;
    gap: 8px;
    border-right: 2px solid #555;
    padding-right: 20px;
  }

  /* Individual Color Dot */
  .chalk-color-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s, border-color 0.2s;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
  }

  .chalk-color-dot:hover {
    transform: scale(1.3);
    border-color: #fff;
  }

  /* Action Buttons */
  .chalk-btn {
    background: none;
    border: none;
    color: white;
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform 0.2s, color 0.2s;
    padding: 0;
  }

  .chalk-btn:hover {
    transform: scale(1.25);
    color: #ffcc00;
  }
</style>

<div id="custom-chalk-toolbar">
  
  <!-- Direct Color Selection Palette -->
  <!-- The colorIndex() corresponds to Chalkboard's default theme array -->
  <div class="color-palette">
    <div class="chalk-color-dot" style="background: #ffffff;" onclick="RevealChalkboard.colorIndex(0)" title="White"></div>
    <div class="chalk-color-dot" style="background: #0000ff;" onclick="RevealChalkboard.colorIndex(1)" title="Blue"></div>
    <div class="chalk-color-dot" style="background: #ff0000;" onclick="RevealChalkboard.colorIndex(2)" title="Red"></div>
    <div class="chalk-color-dot" style="background: #00ff00;" onclick="RevealChalkboard.colorIndex(3)" title="Green"></div>
    <div class="chalk-color-dot" style="background: #ff8800;" onclick="RevealChalkboard.colorIndex(4)" title="Orange"></div>
    <div class="chalk-color-dot" style="background: #ff00ff;" onclick="RevealChalkboard.colorIndex(5)" title="Purple"></div>
    <div class="chalk-color-dot" style="background: #ffff00;" onclick="RevealChalkboard.colorIndex(6)" title="Yellow"></div>
  </div>
  
  <!-- Undo last stroke -->
  <button class="chalk-btn" onclick="document.dispatchEvent(new KeyboardEvent('keydown', { keyCode: 8 }))" title="Undo (Backspace)">
    <i class="fa fa-undo"></i>
  </button>
  
  <!-- Clear entire board -->
  <button class="chalk-btn" onclick="RevealChalkboard.clear()" title="Clear Board (Delete)">
    <i class="fa fa-trash"></i>
  </button>
</div>

<script>
  // This loop constantly monitors Reveal.js to see if a drawing canvas is active
  setInterval(function() {
    var toolbar = document.getElementById('custom-chalk-toolbar');
    
    // Grab both possible drawing layers RevealChalkboard generates
    var chalkboard = document.querySelector('.chalkboard');
    var notesCanvas = document.querySelector('.notescanvas');
    
    // Check if either layer is currently active/visible on screen
    var isBoardActive = chalkboard && chalkboard.style.visibility === 'visible';
    var isNotesActive = notesCanvas && notesCanvas.style.pointerEvents === 'auto';
    
    // Toggle the toolbar display based on the canvases' state
    if (isBoardActive || isNotesActive) {
      toolbar.style.display = 'flex';
    } else {
      toolbar.style.display = 'none';
    }
  }, 300); // Checks every 300ms (lightweight and seamless)
</script>
