
format:
  revealjs:
    html-math-method: katex
    chalkboard: 
      buttons: false
    theme: [serif]
    css: slides.css
    width: 1600
    height: 1000
    slide-number: true
    transition: slide
    center: false
    scroll-view: false
    number-sections: true
    number-depth: 1
    include-after-body: 
      text: |
        <!-- SINGLE UNIFIED CSS BLOCK -->
        <style>
          /* 1. Move the Menu to the top-left */
          .reveal .slide-menu-button {
            top: 30px !important; 
            bottom: auto !important; 
            left: 10px !important;
            margin: 0 !important;
          }

          /* 2. Base style for the Custom Refresh Button */
          #custom-refresh-btn {
            position: fixed;
            top: 30px;
            right: 10px;
            z-index: 2147483647;
            cursor: pointer;
            color: rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
          }
          #custom-refresh-btn:hover {
            transform: scale(1.1);
            color: rgba(0, 0, 0, 0.8);
          }
          
          /* 3. MOBILE SIZING LOGIC */
          /* Now triggers ONLY when the screen width is 500px or narrower, matching the menu */
          @media (max-width: 800px) {
            #custom-chalkboard-btn svg, 
            #custom-notes-btn svg, 
            #custom-refresh-btn svg {
              width: 18px !important;  
              height: 18px !important; 
            }
          }
        </style>

        <!-- CUSTOM BUTTON 1: Chalkboard Easel (Top-Left, under Menu) -->
        <!-- Added id="custom-chalkboard-btn" so the @media query above can find it -->
        <!-- CUSTOM BUTTON 1: Chalkboard Easel (Top-Left, under Menu) -->
        <div id="custom-chalkboard-btn" title="Chalkboard" 
            onclick="if(window.RevealChalkboard) { RevealChalkboard.toggleChalkboard(); } else if (Reveal.getPlugin('chalkboard')) { Reveal.getPlugin('chalkboard').toggleChalkboard(); }" 
            style="position: fixed; top: 75px; left: 10px; z-index: 2147483647; cursor: pointer; color: rgba(0, 0, 0, 0.4); transition: all 0.2s ease;"
            onmouseover="this.style.transform='scale(1.1)'; this.style.color='rgba(0, 0, 0, 0.8)';" 
            onmouseout="this.style.transform='scale(1)'; this.style.color='rgba(0, 0, 0, 0.3)';">
          <!-- Notice the width="30" and height="30" are here -->
          <svg viewBox="0 0 24 24" width="30" height="30" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <!-- These three lines are the missing shapes that draw the easel! -->
            <rect x="4" y="4" width="16" height="12" rx="2" ry="2"></rect>
            <line x1="12" y1="16" x2="12" y2="20"></line>
            <line x1="8" y1="20" x2="16" y2="20"></line>
          </svg>
        </div>

        <!-- CUSTOM BUTTON 2: Notes Pen (Top-Left, under Easel) -->
        <!-- Added id="custom-notes-btn" so the @media query above can find it -->
        <div id="custom-notes-btn" title="Notes Canvas" 
             onclick="if(window.RevealChalkboard) { RevealChalkboard.toggleNotesCanvas(); } else if (Reveal.getPlugin('chalkboard')) { Reveal.getPlugin('chalkboard').toggleNotesCanvas(); }" 
             style="position: fixed; top: 120px; left: 10px; z-index: 2147483647; cursor: pointer; color: rgba(0, 0, 0, 0.4); transition: all 0.2s ease;"
             onmouseover="this.style.transform='scale(1.1)'; this.style.color='rgba(0, 0, 0, 0.8)';" 
             onmouseout="this.style.transform='scale(1)'; this.style.color='rgba(0, 0, 0, 0.3)';">
          <!-- DEFAULT DESKTOP SIZE is 25px -->
          <!-- Change width="25" and height="25" to match the number you chose above -->
          <svg viewBox="0 0 24 24" width="30" height="30" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
          </svg>
        </div>

        <!-- CUSTOM BUTTON 3: Refresh Button (Top-Right) -->
        <div id="custom-refresh-btn" title="Refresh Page" onclick="window.location.reload();">
          <!-- DEFAULT DESKTOP SIZE is 25px -->
          <svg viewBox="0 0 24 24" width="25" height="25" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </div>

        <!-- LAYOUT FIX SCRIPT -->
        <script>
          window.addEventListener('load', function() {
            setTimeout(function() { 
              if(window.Reveal) Reveal.layout(); 
            }, 200); 
          });
        </script>
    menu:
      side: left         
      width: wide        
      numbers: true      
      custom:
        - title: "Display"
          icon: '<i class="fa fa-desktop"></i>'
          content: |
            <div style="display: block;">
              <h1 class="slide-menu-title">Display Ratio</h1>
              <ul class="slide-menu-items">
                <li class="slide-menu-item"><a onclick="Reveal.configure({ width: 1600, height: 900 });">Widescreen (16:9)</a></li>
                <li class="slide-menu-item"><a onclick="Reveal.configure({ width: 1200, height: 900 });">Standard (4:3)</a></li>
                <li class="slide-menu-item"><a onclick="Reveal.configure({ width: 1440, height: 900 });">Tall (16:10)</a></li>
              </ul>
              <h1 class="slide-menu-title" style="margin-top: 25px;">Continuous Font Size (px)</h1>
              <div style="padding: 10px 20px; font-family: sans-serif;">
                <input type="range" class="reveal-font-slider" min="16" max="72" step="2" value="32" 
                       oninput="document.querySelector('.reveal').style.fontSize = this.value + 'px'; Reveal.layout();" 
                       style="width: 100%; cursor: pointer;">
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-top: 10px; color: #ccc;">
                  <span>Smaller</span>
                  <span onclick="document.querySelector('.reveal').style.fontSize = ''; document.querySelector('.reveal-font-slider').value = 32; Reveal.layout();" 
                        style="cursor: pointer; color: #fff; font-weight: bold; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px;">
                    Reset
                  </span>
                  <span>Larger</span>
                </div>
              </div>
              <h1 class="slide-menu-title" style="margin-top: 25px;">Debug Tools</h1>
              <div style="padding: 10px 20px; font-family: sans-serif;">
                <label style="display: flex; justify-content: space-between; align-items: center; font-size: 16px; color: #ccc; cursor: pointer;">
                  <span>Show Section Frames</span>
                  <input type="checkbox" checked onchange="document.body.classList.toggle('hide-debug');" style="width: 18px; height: 18px; cursor: pointer;">
                </label>
              </div>
            </div>

