<script>
document.addEventListener('keydown', function(event) {
  // Ignore key presses if the user is typing in an input field
  if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;

  // Only trigger if the SHIFT key is being held down
  if (event.shiftKey) {
    // Shift + W for Widescreen (16:9)
    if (event.key === 'W' || event.key === 'w') {
      event.preventDefault(); 
      Reveal.configure({ width: 1600, height: 900 });
      console.log("Switched to 16:9 Widescreen");
    } 
    // Shift + S for Standard (4:3) - Safely ignores speaker notes
    else if (event.key === 'S' || event.key === 's') {
      event.preventDefault();
      Reveal.configure({ width: 1200, height: 900 });
      console.log("Switched to 4:3 Standard");
    }
    // Shift + T for Tall (16:10)
    else if (event.key === 'T' || event.key === 't') {
      event.preventDefault();
      Reveal.configure({ width: 1440, height: 900 });
      console.log("Switched to 16:10 Tall");
    }
  }
});
</script>
